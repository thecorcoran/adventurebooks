<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category — Alaskan & Seafaring Adventures</title>
    <link rel="stylesheet" href="tufte.css">
</head>
<body>

    <main class="tufte-container">
        <nav>
            <a href="index.html" class="nav-back">&larr; Return to Library Index</a>
        </nav>

        <div id="book-container">
            <!-- Book section will be dynamically inserted here -->
        </div>

        <footer class="colophon">
            <p>Preserved in the public domain. Free editions accessible via Project Gutenberg and LibriVox.</p>
        </footer>
    </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('book-container');
            const params = new URLSearchParams(window.location.search);
            const category = params.get('cat');

            if (!container || !category || !bookData[category]) {
                if (container) {
                    container.innerHTML = `
                        <h2>Section Not Found</h2>
                        <p>The requested section could not be located in this library collection. Please <a href="index.html">return to the index</a>.</p>
                    `;
                }
                return;
            }

            document.title = `${category} — Alaskan & Seafaring Adventures`;
            container.innerHTML = renderSection(category, bookData[category]);
        });
    </script>
</body>
</html>
