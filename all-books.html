<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Catalog — Alaskan & Seafaring Adventures</title>
    <link rel="stylesheet" href="tufte.css">
</head>
<body>

    <main class="tufte-container">
        <nav>
            <a href="index.html" class="nav-back">&larr; Return to Library Index</a>
        </nav>

        <header>
            <h1>Complete Catalog of Volumes</h1>
            <p class="subtitle">The full index of public domain Alaskan wilderness chronicles, seafaring voyages, and polar expeditions.</p>
        </header>

        <div class="search-wrapper">
            <div class="search-input-group">
                <label for="searchInput" class="search-label">Filter Catalog:</label>
                <input type="text" id="searchInput" class="search-field" placeholder="Search by title, author, or keyword..." autocomplete="off">
            </div>
            <div id="searchMeta" class="search-meta"></div>
        </div>

        <div id="book-container">
            <!-- Book sections dynamically inserted here -->
        </div>

        <footer class="colophon">
            <p>All works cataloged herein reside in the public domain. Texts provided by Project Gutenberg; audiobooks by LibriVox volunteers.</p>
        </footer>
    </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('book-container');
            const searchInput = document.getElementById('searchInput');
            const searchMeta = document.getElementById('searchMeta');
            if (!container) return;

            // Render all sections
            let allSectionsHTML = '';
            let totalBooks = 0;
            for (const category in bookData) {
                allSectionsHTML += renderSection(category, bookData[category]);
                totalBooks += bookData[category].books.length;
            }
            container.innerHTML = allSectionsHTML;
            if (searchMeta) {
                searchMeta.textContent = `Displaying ${totalBooks} total volumes across ${Object.keys(bookData).length} categories.`;
            }

            // Real-time catalog filtering
            if (searchInput) {
                searchInput.addEventListener('input', function() {
                    const query = this.value.trim().toLowerCase();
                    let matchedCount = 0;

                    document.querySelectorAll('.book-section').forEach(section => {
                        let visibleInSection = 0;
                        section.querySelectorAll('.book-entry').forEach(item => {
                            const text = item.textContent.toLowerCase();
                            const isMatch = text.includes(query);
                            item.style.display = isMatch ? '' : 'none';
                            if (isMatch) {
                                visibleInSection++;
                                matchedCount++;
                            }
                        });
                        section.style.display = visibleInSection > 0 ? '' : 'none';
                    });

                    if (searchMeta) {
                        if (query === '') {
                            searchMeta.textContent = `Displaying ${totalBooks} total volumes across ${Object.keys(bookData).length} categories.`;
                        } else {
                            searchMeta.textContent = `Found ${matchedCount} matching volume${matchedCount === 1 ? '' : 's'}.`;
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
